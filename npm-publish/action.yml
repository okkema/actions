name: 'Setup Node and Publish to npm'
description: 'Sets up Node.js and publishes a package to npm'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: 'lts/*'
  node-version-file:
    description: 'Path to node version file (e.g. .nvmrc)'
    required: false
    default: ''
  registry-url:
    description: 'npm registry URL'
    required: false
    default: 'https://registry.npmjs.org'
  npm-token:
    description: 'npm authentication token (omit to use OIDC/trusted publishing)'
    required: false
    default: ''
  scope:
    description: 'npm scope (e.g. @myorg)'
    required: false
    default: ''
  version:
    description: 'Package version to set before publishing (e.g. v1.2.3 or 1.2.3)'
    required: false
    default: ''
  commit:
    description: 'Commit version change back to the repo after publishing'
    required: false
    default: 'false'
  access:
    description: 'npm access level (e.g. public for scoped packages)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      run: npm ci || npm install
      shell: bash

    - name: Set version
      if: inputs.version != ''
      run: |
        CURRENT=$(node -p "require('./package.json').version")
        DESIRED="${{ inputs.version }}"
        DESIRED="${DESIRED#v}"
        if [ "$CURRENT" != "$DESIRED" ]; then
          npm version "$DESIRED" --no-git-tag-version
        fi
      shell: bash

    - name: Publish to npm (token)
      if: inputs.npm-token != ''
      run: >-
        npm publish
        ${{ inputs.scope != '' && format('--scope {0}', inputs.scope) || '' }}
        ${{ inputs.access != '' && format('--access {0}', inputs.access) || '' }}
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}

    - name: Publish to npm (OIDC)
      if: inputs.npm-token == ''
      run: >-
        npm publish
        ${{ inputs.scope != '' && format('--scope {0}', inputs.scope) || '' }}
        ${{ inputs.access != '' && format('--access {0}', inputs.access) || '' }}
      shell: bash

    - name: Commit version
      if: inputs.commit == 'true' && inputs.version != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add package.json
        git diff --staged --quiet || git commit -m "chore: release ${{ inputs.version }}"
        git push
      shell: bash
